baseURL = "https://ilar.in/"
languageCode = "en-us"
title = "ilar.in"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "ilar.in"
  description = "Ilari's blog"
  author = "Ilari"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  comments = false
  hidemeta = false
  hideSummaryInList = false

  [params.homeInfoParams]
    Title = "Hi"
    Content = "Welcome to my blog."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/iler"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
